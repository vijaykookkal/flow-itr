<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="itr-token" content="__ITR_TOKEN__">
<title>Flow</title>
<script>
  try {
    var t = localStorage.getItem('flow-theme');
    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
  } catch (e) { /* private window: fall back to the system setting */ }
</script>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preload" href="fonts/figtree-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#panel">Skip to the page</a>

<!-- Always in view, whatever is open below: which return this is, a way to
     find any line, whether the figures are current, and what is owed. -->
<header class="top" id="top">
  <a class="brand" href="#overview" aria-label="Flow, overview">
    <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="8" fill="#0B57D0"/>
      <path d="M11 24V13.5A4.5 4.5 0 0 1 15.5 9H22" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M11 17h6.6" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="22.1" cy="17" r="1.9" fill="#A9C7FF"/>
    </svg>
    <span class="brand-name">Flow</span>
  </a>

  <div class="return" id="return" title="The return you are working on. Switch here; manage them under Returns.">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="8.2" r="3.5"/>
      <path d="M5 19.5c.6-3.6 3.5-5.6 7-5.6s6.4 2 7 5.6"/>
    </svg>
    <div class="return-main">
      <label class="return-pick"><span>Return:</span><select id="profile" aria-label="Return"></select></label>
    </div>
  </div>

  <button class="search" id="search-open" type="button" aria-haspopup="dialog">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="11" cy="11" r="6.2"/><path d="M20 20l-4.4-4.4"/>
    </svg>
    <span class="search-text">Search a line, an amount or a document</span>
    <kbd>Ctrl K</kbd>
  </button>

  <div class="top-end">
    <a class="start-btn" id="start-btn" href="#home/start" title="How to use Flow, step by step">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.6 2.3c-.8.4-1.2 1-1.2 1.9M12 16.8v.1"/>
      </svg>
      <span>Getting started</span>
    </a>

    <button class="fresh" id="fresh" type="button">
      <span class="fresh-dot" aria-hidden="true"></span>
      <span class="fresh-text" id="fresh-text">Loading</span>
    </button>

    <div class="menu-wrap">
      <button id="activity-btn" class="icon-btn" type="button" aria-haspopup="true"
              aria-expanded="false" aria-label="Activity" title="Activity">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-6 4 12 2.5-6h5"/></svg>
        <span class="icon-dot" id="activity-dot" hidden></span>
      </button>
      <div class="menu menu-wide" id="activity-menu" hidden></div>
    </div>

    <div class="menu-wrap">
      <button id="settings-btn" class="icon-btn" type="button" aria-haspopup="true"
              aria-expanded="false" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h8M18 7h2M4 12h2M12 12h8M4 17h6M16 17h4"/>
          <circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="12" r="2.2"/><circle cx="13" cy="17" r="2.2"/>
        </svg>
      </button>
      <div class="menu" id="settings-menu" hidden>
        <div class="menu-cap">Appearance</div>
        <button class="menu-item" type="button" role="menuitemradio" data-theme-choice="system">
          <span class="menu-tick" aria-hidden="true">&#10003;</span> Match the system
        </button>
        <button class="menu-item" type="button" role="menuitemradio" data-theme-choice="light">
          <span class="menu-tick" aria-hidden="true">&#10003;</span> Light
        </button>
        <button class="menu-item" type="button" role="menuitemradio" data-theme-choice="dark">
          <span class="menu-tick" aria-hidden="true">&#10003;</span> Dark
        </button>
        <div class="menu-sep"></div>
        <a class="menu-item" href="#_profiles"><span class="menu-tick"></span> Returns</a>
        <a class="menu-item" href="#home/start"><span class="menu-tick"></span> Getting started</a>
      </div>
    </div>
  </div>
</header>

<div class="frame">
  <nav class="nav" id="rail" aria-label="Areas and schedules"></nav>
  <main class="panel" id="panel" tabindex="-1"></main>
</div>

<!-- Evidence for one figure: how it was reached, the printed line it came
     from, what the department holds, and where it goes next. -->
<aside class="evidence" id="evidence" aria-label="Evidence for the selected figure" hidden></aside>

<div class="palette-back" id="palette" hidden>
  <div class="palette" role="dialog" aria-modal="true" aria-label="Search">
    <div class="palette-in">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="6.2"/><path d="M20 20l-4.4-4.4"/>
      </svg>
      <input id="palette-input" type="text" autocomplete="off" spellcheck="false"
             placeholder="Search a line, an amount or a document"
             role="combobox" aria-expanded="true" aria-controls="palette-list">
      <kbd>Esc</kbd>
    </div>
    <div class="palette-list" id="palette-list" role="listbox"></div>
    <div class="palette-foot">
      <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> to move</span>
      <span><kbd>Enter</kbd> to open</span>
      <span>An amount can be typed with or without commas</span>
    </div>
  </div>
</div>

<dialog id="override-dialog">
  <form method="dialog" id="override-form">
    <h3>Correct this value</h3>
    <p class="ptr" id="ov-pointer"></p>
    <label>As read from the document<input id="ov-was" disabled></label>
    <label>Corrected value<input id="ov-value" inputmode="numeric" required></label>
    <label>Why
      <span class="hint">This is the audit trail. Write it for someone reading it in three years.</span>
      <textarea id="ov-reason" rows="3" required></textarea>
    </label>
    <menu>
      <button value="cancel" type="submit" class="ghost" formnovalidate>Cancel</button>
      <button value="save" type="submit" class="primary">Save correction</button>
    </menu>
  </form>
</dialog>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="app.js"></script>
<script src="charts.js"></script>
<script src="pages.js"></script>
<script src="shell.js"></script>
</body>
</html>
